name: Build Mono 5.4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mono:
    runs-on: ubuntu-latest
    # 改用 ubuntu:18.04
    container:
      image: ubuntu:18.04

    steps:
      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            g++ \
            gcc \
            gettext \
            make \
            cmake \
            python \
            curl \
            bison \
            liblzma-dev \
            ca-certificates
          update-ca-certificates

      - name: Checkout Mono 5.4
        run: |
          git clone --depth 1 --branch mono-5.4.1.7 https://github.com/mono/mono.git mono-src
          cd mono-src
          git submodule update --init --recursive

      - name: Configure and Build
        working-directory: mono-src
        run: |
          ./autogen.sh --prefix=/opt/mono-5.4 --disable-nls
          make -j$(nproc)
          make install

      - name: Tar Artifacts
        run: |
          tar -czf mono-5.4-linux-x64.tar.gz -C /opt/mono-5.4 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-5.4-linux-x64
          path: mono-5.4-linux-x64.tar.gz

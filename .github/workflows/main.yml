name: Build Unity 5.4 Mono for Android via Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build in Ubuntu 20.04 Container
        # 用单引号把命令包起来，并且用 $PWD 代替 GitHub 的表达式，彻底杜绝语法冲突
        run: |
          docker run --rm -v "$PWD":/work -w /work ubuntu:20.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            
            apt-get update && apt-get install -y \
              build-essential autoconf automake libtool bison gettext perl python2 gcc-9 g++-9
            
            ln -sf /usr/bin/python2 /usr/bin/python
            
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100
            update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 100
            
            export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle
            
            cd /work
            chmod +x external/buildscripts/build_runtime_android.sh
            ./external/buildscripts/build_runtime_android.sh
          '

      - name: Upload libmono.so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-5.4-android-mono
          path: builds/embedruntimes/android/

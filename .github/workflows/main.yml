name: Build Unity Mono 5.4

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git Protocol Globally
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update Submodules
        run: |
          git submodule update --init --recursive

      - name: Build Mono inside Ubuntu 18.04 Container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e
              
              apt-get update
              apt-get install -y \
                pkg-config \
                libglib2.0-dev \
                zlib1g-dev \
                autoconf \
                automake \
                libtool \
                libtool-bin \
                g++ \
                gcc \
                gettext \
                make \
                cmake \
                python \
                curl \
                bison \
                liblzma-dev \
                ca-certificates

              export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig:\$PKG_CONFIG_PATH

              # Unity Mono 标准构建参数：禁用 NLS、使用 embedded glib 并指定 SGen GC
              ./autogen.sh \
                --prefix=/opt/mono \
                --disable-nls \
                --with-glib=embedded \
                --with-gc=sgen

              # 1. 先单线程编译 libgc，避免旧版 libgc 的多线程构建 race condition
              make -C libgc -j1
              
              # 2. 剩余部分使用多核满速并行编译
              make -j\$(nproc)
              make install
              
              tar -czf /workspace/mono-unity-5.4-linux-x64.tar.gz -C /opt/mono .
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-unity-5.4-linux-x64
          path: mono-unity-5.4-linux-x64.tar.gz

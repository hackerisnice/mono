name: Build Unity 5.4 Mono for Android via macOS Intel (NDK r10e Native)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Modern Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ============================================================
      # 修正点：更换为稳定的 .zip 链接，并适配其解压方式
      # ============================================================
      - name: Download and Setup NDK r10e (macOS Intel 64-bit)
        shell: bash
        run: |
          mkdir -p ~/ndk
          cd ~/ndk
          # 链接已从 .bin 更换为 .zip
          curl -L -o android-ndk-r10e-darwin-x86_64.zip \
            "https://dl.google.com/android/repository/android-ndk-r10e-darwin-x86_64.zip"
          # 解压 .zip 文件
          unzip -q android-ndk-r10e-darwin-x86_64.zip
          echo "ANDROID_NDK_ROOT=~/ndk/android-ndk-r10e" >> $GITHUB_ENV

      # 以下所有 'sed' 修复逻辑保持不变，仅调整了 HOST_ENV 为 darwin
      - name: Match Tutorial Modifications (macOS sed syntax)
        shell: bash
        run: |
          sed -i '' 's/-g /-O2 /g' external/buildscripts/build_runtime_android.sh
          sed -i '' 's/$HOST_ENV = "linux";/$HOST_ENV = "darwin";/g' external/buildscripts/PrepareAndroidSDK.pm
          sed -i '' 's/$OEXT = "so";/$OEXT = "dylib";/g' external/buildscripts/PrepareAndroidSDK.pm
          sed -i '' 's/$EXEEXT = "";/$EXEEXT = "";/g' external/buildscripts/PrepareAndroidSDK.pm

      - name: Hotfix - Force Android platform macros
        shell: bash
        run: |
          find . -name "*.h" -o -name "*.c" | xargs sed -i '' 's/#ifdef _WIN32/#if defined(_WIN32) \&\& !defined(TARGET_ANDROID)/g'
          echo '#define HOST_ANDROID 1' >> mono/utils/mono-publib.h
          echo '#define TARGET_ANDROID 1' >> mono/utils/mono-publib.h

      - name: Hotfix - Android pthread linking
        shell: bash
        run: |
          find . -name "Makefile" -o -name "*.mk" | xargs sed -i '' 's/-lpthread//g'
          sed -i '' 's/-lpthread//g' external/buildscripts/build_runtime_android.sh

      - name: Hotfix - Remove SystemTap probes
        shell: bash
        run: |
          find . -name "*.c" -exec sed -i '' 's/#include <sys\/sdt.h>/\/* #include <sys\/sdt.h> *\//g' {} \;
          find . -name "*.c" -exec sed -i '' 's/ STAP_PROBE[^(]*([^;]*);//g' {} \;
          echo 'int main() { return 0; }' > mono/profiler/profiler-stap.c

      - name: Hotfix - Link liblog and libdl for Android
        shell: bash
        run: |
          find . -name "Makefile" | xargs sed -i '' 's/LIBS = /LIBS = -llog -ldl /g'
          sed -i '' 's/-shared -Wl/-shared -Wl,--no-undefined -llog -ldl/g' external/buildscripts/build_runtime_android.sh

      - name: Execute macOS Build Suite
        shell: bash
        run: |
          chmod +x external/buildscripts/build_runtime_android.sh
          ./external/buildscripts/build_runtime_android.sh

      - name: Upload libmono.so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-5.4-android-macos-intel-mono
          path: builds/embedruntimes/android/

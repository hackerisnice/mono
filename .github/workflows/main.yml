name: Build Unity 5.4 Mono for Android via Docker

on:
  workflow_dispatch:

jobs:
  build:
    # 使用最新且不排队的宿主机系统
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build in Ubuntu 20.04 Container (Docker 挂载编译)
        run: |
          # 启动一个标准的 Ubuntu 20.04 容器，并将当前的 mono 源码目录挂载到容器的 /work 路径
          docker run --rm -v ${{ github.workspace }}:/work -w /work ubuntu:20.04 bash -c "
            # 1. 切换容器内为非交互模式，防止 apt 弹出地区选择卡住
            export DEBIAN_FRONTEND=noninteractive
            
            # 2. 容器内更新源并安装老版本工具链（Ubuntu 20.04 官方自带 python2 候选包！）
            apt-get update && apt-get install -y \
              build-essential autoconf automake libtool bison gettext perl curl unzip \
              python2 gcc-9 g++-9
            
            # 3. 强行建立 python 软链接，确保老脚本调用 python 时能顺畅执行
            ln -sf /usr/bin/python2 /usr/bin/python
            
            # 4. 配置老版本 GCC 编译器环境，防止新语法报错
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100
            update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 100
            
            # 5. 下载并配置远古 NDK r10e
            cd /home
            curl -O https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
            unzip -q android-ndk-r10e-linux-x86_64.zip
            export ANDROID_NDK_ROOT=/home/android-ndk-r10e
            
            # 6. 回到挂载的代码目录，强行赋予执行权限并疯狂编译
            cd /work
            chmod +x external/buildscripts/build_runtime_android.sh
            ./external/buildscripts/build_runtime_android.sh
          "

      - name: Upload libmono.so Artifact (收割留在宿主机的产物)
        uses: actions/upload-artifact@v4
        with:
          name: unity-5.4-android-mono
          # 因为 Docker 内部的 /work 是跟宿主机绑定的，编译完后产物会自动同步回宿主机的路径
          path: builds/embedruntimes/android/

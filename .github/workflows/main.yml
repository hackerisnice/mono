name: Build Unity Mono 5.4

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # 适配 Unity 5.4 Mono 年代的基础编译工具链与环境
      image: ubuntu:18.04

    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            g++ \
            gcc \
            gettext \
            make \
            cmake \
            python \
            curl \
            bison \
            liblzma-dev \
            ca-certificates
          update-ca-certificates

      - name: Configure Git Protocols and Permissions
        run: |
          # 1. 核心：将已失效的 git:// 全局重定向为 https://
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          # 2. 避免 Docker 容器内挂载目录导致的 safe.directory 报错
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # 拉取当前仓库的代码（先不自动拉 submodules，以便上面协议重定向生效）
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update Submodules
        run: |
          # 此时子模块会按已重定向的 https 协议拉取
          git submodule update --init --recursive

      - name: Build Mono
        run: |
          # 如需指定前缀可加 --prefix=/opt/mono
          ./autogen.sh --disable-nls --prefix=/opt/mono
          make -j$(nproc)
          make install

      - name: Package Artifact
        run: |
          tar -czf mono-unity-5.4-linux-x64.tar.gz -C /opt/mono .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-unity-5.4-linux-x64
          path: mono-unity-5.4-linux-x64.tar.gz

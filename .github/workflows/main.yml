name: Build Unity 5.4 Mono for Android via CentOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 宿主机依然用最快不排队的 ubuntu-latest
    
    # 核心黑魔法：让整个 Job 直接原生运行在 CentOS 7 容器内
    container:
      image: centos:7

    steps:
      - name: Install Base Utilities (CentOS 基础工具与 32 位运行库)
        # CentOS 7 自带标准的 Python 2.7 (通过 python 命令直接调用)
        # 同时安装 glibc.i686 以防 NDK 内部的 32 位老二进制文件报 No such file
        run: |
          yum makecache fast
          yum install -y \
            gawk make gcc gcc-c++ autoconf automake libtool bison gettext perl curl unzip \
            glibc.i686 zlib.i686 libstdc++.i686

      - name: Checkout Code
        # 在自定义 container 中使用 checkout，GitHub 会自动处理好容器内的 git 环境
        uses: actions/checkout@v4

      - name: Download and Setup NDK r10e
        run: |
          mkdir -p /opt
          cd /opt
          # 下载 64 位 NDK（兼容 CentOS 宿主机，且内部 32 位组件已被上面的 i686 库激活）
          curl -L -O https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
          
          # 写入环境变量到全局环境
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r10e" >> $GITHUB_ENV

      - name: Build Mono Runtime
        run: |
          # 此时已经在 CentOS 根目录，且 checkout 出来的代码就在当前工作路径下
          chmod +x external/buildscripts/build_runtime_android.sh
          ./external/buildscripts/build_runtime_android.sh

      - name: Upload libmono.so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-5.4-android-mono
          path: builds/embedruntimes/android/

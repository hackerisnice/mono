name: Build Unity 5.4 Mono for Android via macOS

on:
  workflow_dispatch:

jobs:
  build:
    # 【核心修改】换成最新且官方完全支持的 Intel 架构 macOS 15 镜像
    # 资源极大丰富，点击后直接秒进构建，绝不排队！
    runs-on: macos-15-intel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies via Homebrew (安装 macOS 编译依赖)
        # 现代 macOS 环境通过新版 brew 快速补齐远古 autotools 链
        run: |
          brew install autoconf automake libtool gettext pidof
          # 将 gettext 的路径强行塞进环境变量，防止老脚本报错找不到 msgfmt
          echo "/usr/local/opt/gettext/bin" >> $GITHUB_PATH

      - name: Download and Setup NDK r10e
        # 下载官方纯正的 macOS (Darwin) 64位 NDK 压缩包
        run: |
          mkdir -p /opt
          cd /opt
          curl -L -O https://dl.google.com/android/repository/android-ndk-r10e-darwin-x86_64.zip
          unzip -q android-ndk-r10e-darwin-x86_64.zip
          
          # 注入 NDK 环境变量到全局，Unity 脚本会自动抓取
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r10e" >> $GITHUB_ENV

      - name: Build Mono Runtime (编译)
        run: |
          chmod +x external/buildscripts/build_runtime_android.sh
          ./external/buildscripts/build_runtime_android.sh

      - name: Upload libmono.so Artifact (收割产物)
        uses: actions/upload-artifact@v4
        with:
          name: unity-5.4-android-mono
          path: builds/embedruntimes/android/

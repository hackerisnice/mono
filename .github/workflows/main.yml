name: Build Unity 5.4 Mono for Android

on:
  workflow_dispatch:

jobs:
  build:
    # 换成最新且完全无需排队的系统版本
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (安装系统依赖)
        run: |
          sudo apt-get update
          # 安装基础工具，同时安装较旧的 gcc-9 和 g++-9 编译器
          sudo apt-get install -y build-essential autoconf automake libtool bison gettext perl python2 curl unzip gcc-9 g++-9

      - name: Setup GCC 9 (强制切换到老版编译器环境)
        # 用新系统最怕遇到新版 GCC 严格报错，通过这种方式强行降级编译器逻辑
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 100
          # 验证当前系统默认 GCC 是 9.x 版本
          gcc --version

      - name: Download and Setup NDK r10e (下载NDK)
        run: |
          cd /home/runner
          curl -O https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=/home/runner/android-ndk-r10e" >> $GITHUB_ENV

      - name: Build Mono Runtime (编译)
        run: |
          chmod +x external/buildscripts/build_runtime_android.sh
          ./external/buildscripts/build_runtime_android.sh

      - name: Upload libmono.so Artifact (上传产物)
        uses: actions/upload-artifact@v4
        with:
          name: unity-5.4-android-mono
          path: builds/embedruntimes/android/

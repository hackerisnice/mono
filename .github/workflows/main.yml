name: Build Mono 5.4

on:  
  workflow_dispatch:

jobs:
  build-mono:
    runs-on: ubuntu-latest
    # 核心：使用 Ubuntu 16.04 或 18.04 的 Docker 容器
    container:
      image: ubuntu:16.04

    steps:
      - name: Update apt sources (适配已停止支持的旧源)
        run: |
          sed -i -e 's/archive.ubuntu.com/old-releases.ubuntu.com/g' \
                 -e 's/security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          apt-get update

      - name: Install Build Dependencies
        run: |
          apt-get install -y \
            git \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            g++ \
            gcc \
            gettext \
            make \
            cmake \
            python \
            curl \
            bison \
            liblzma-dev \
            ca-certificates
          update-ca-certificates

      # 注意：actions/checkout@v4 依赖 node20，在极旧的系统（如 ubuntu 16.04）中若 glibc 过旧可能会报错。
      # 如果 actions/checkout 失败，可降级使用 actions/checkout@v3 或在 step 中直接 git clone。
      - name: Checkout Mono 5.4
        run: |
          git clone --depth 1 --branch mono-5.4.1.7 https://github.com/mono/mono.git mono-src
          cd mono-src
          git submodule update --init --recursive

      - name: Configure and Build
        working-directory: mono-src
        run: |
          ./autogen.sh --prefix=/opt/mono-5.4 --disable-nls
          make -j$(nproc)
          make install

      - name: Tar Artifacts
        run: |
          tar -czf mono-5.4-linux-x64.tar.gz -C /opt/mono-5.4 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-5.4-linux-x64
          path: mono-5.4-linux-x64.tar.gz

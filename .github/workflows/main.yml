name: Build Unity Mono 5.4

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git Protocol Globally
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update Submodules
        run: |
          git submodule update --init --recursive

      - name: Build Mono inside Ubuntu 18.04 Container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e
              
              apt-get update
              apt-get install -y \
                pkg-config \
                libglib2.0-dev \
                zlib1g-dev \
                autoconf \
                automake \
                libtool \
                libtool-bin \
                g++ \
                gcc \
                gettext \
                make \
                cmake \
                python \
                curl \
                bison \
                liblzma-dev \
                ca-certificates

              # 显式指定 64 位 multiarch 的 pkg-config 路径
              export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/usr/lib/pkgconfig:\$PKG_CONFIG_PATH

              # 使用 embedded glib (Unity Mono 官方推荐构建模式)
              ./autogen.sh \
                --disable-nls \
                --prefix=/opt/mono \
                --with-glib=embedded

              make -j\$(nproc)
              make install
              
              tar -czf /workspace/mono-unity-5.4-linux-x64.tar.gz -C /opt/mono .
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-unity-5.4-linux-x64
          path: mono-unity-5.4-linux-x64.tar.gz
